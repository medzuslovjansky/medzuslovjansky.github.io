name: Pull Request
on:
  pull_request:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      can-deploy: ${{ steps.gate.outputs.can-deploy }}
    env:
      # Both are read by docusaurus.config.js at build time: DEPLOYMENT_URL sets
      # the site url, GITHUB_PR_NUMBER points "edit this page" at the PR diff.
      GITHUB_PR_NUMBER: ${{ github.event.pull_request.number }}
      DEPLOYMENT_URL: https://site-interslavic-pr-${{ github.event.pull_request.number }}.surge.sh
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2 # To retrieve the preceding commit.

      - name: Decide whether a preview can be published
        id: gate
        # Dependabot and fork PRs run with a read-only GITHUB_TOKEN and no access
        # to secrets, so they can build but can never publish to Surge.
        run: |
          echo "can-deploy=${{ github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' }}" >> "$GITHUB_OUTPUT"

      - name: Get changed files
        id: changed-files
        # SHA-pinned: this action had its version tags retroactively repointed
        # to malicious code in the March 2025 supply-chain attack. Pin, don't float.
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          separator: '\n'

      - name: Write changed files to log
        run: |
          echo "${{ steps.changed-files.outputs.all_changed_files }}" > git-changes.log
          cat git-changes.log

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build a preview
        run: yarn build

      - name: Upload build
        if: steps.gate.outputs.can-deploy == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: preview-build
          path: build
          retention-days: 1

  deploy-preview:
    needs: build
    if: needs.build.outputs.can-deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment:
      name: preview
      url: https://site-interslavic-pr-${{ github.event.pull_request.number }}.surge.sh
    env:
      DEPLOYMENT_URL: https://site-interslavic-pr-${{ github.event.pull_request.number }}.surge.sh
    steps:
      - name: Download build
        uses: actions/download-artifact@v8
        with:
          name: preview-build
          path: build

      # No checkout here on purpose: this job only ships the prebuilt artifact,
      # so it uses the runner's preinstalled Node to run `npx surge`.
      - name: Deploy to Surge
        run: npx surge ./build ${{ env.DEPLOYMENT_URL }}
        env:
          SURGE_LOGIN: ${{ secrets.SURGE_LOGIN }}
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
