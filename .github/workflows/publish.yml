name: Publish
on:
  workflow_dispatch:
jobs:
  publish-website:
    runs-on: ubuntu-latest
    permissions:
      contents: write # pushes the gh-pages branch and the `deployed` tag
    environment:
      name: production
      url: http://interslavic.fun/
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build website
        run: yarn build
        env:
          NODE_OPTIONS: '--max_old_space_size=5000'

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
          user_name: Medžuslovjansky Bot
          user_email: noreply@interslavic.fun

      - name: Update Tag
        run: |
          git tag --force deployed
          git push --tags --force origin
